identity:
  author: namirali
  name: companyenrich
  label:
    en_US: CompanyEnrich
  description:
    en_US: Company and people enrichment, discovery, workforce and explicit advanced
      API jobs.
  icon: icon.svg
  tags:
  - business
  - search
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
