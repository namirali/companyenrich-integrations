    placeholder:
      en_US: Your API key, without the Bearer prefix
    help:
      en_US: Create an API key in your CompanyEnrich dashboard. Validation uses the
        free account endpoint.
    url: https://app.companyenrich.com/
tools:
- tools/enrich_company.yaml
- tools/search_companies.yaml
- tools/find_similar_companies.yaml
- tools/search_people.yaml
- tools/lookup_person.yaml
- tools/get_workforce.yaml
- tools/enrich_company_by_properties.yaml
- tools/enrich_companies_batch.yaml
- tools/get_company.yaml
- tools/get_person.yaml
- tools/count_companies.yaml
- tools/count_similar_companies.yaml
- tools/advanced_operation.yaml
extra:
  python:
    source: provider/companyenrich.py
