identity:
  name: find_similar_companies
  author: namirali
  label:
    en_US: Find Similar Companies
description:
  human:
    en_US: Find companies similar to seed company domains. Returns one page and may
      consume CompanyEnrich credits.
  llm: Find companies similar to seed company domains. Returns one page and may consume
    CompanyEnrich credits.
parameters:
- name: domains
  type: string
  required: true
  label:
    en_US: Domains
  human_description:
    en_US: One to ten company domains separated by commas, for example stripe.com,adyen.com.
  llm_description: One to ten company domains separated by commas, for example stripe.com,adyen.com.
  form: llm
- name: page
  type: number
  required: false
  default: 1
  min: 1
  max: 10000
  precision: 0
  label:
    en_US: Page
  human_description:
    en_US: Page number, starting at 1. Page × page size cannot exceed 10,000.
  llm_description: Page number, starting at 1. Page × page size cannot exceed 10,000.
  form: llm
- name: page_size
  type: number
  required: false
  default: 10
  min: 1
  max: 100
  precision: 0
  label:
    en_US: Page Size
  human_description:
    en_US: Maximum results on this page. Additional pages require explicit tool calls
      and may consume credits.
  llm_description: Maximum results on this page. Additional pages require explicit
    tool calls and may consume credits.
  form: llm
extra:
  python:
    source: tools/find_similar_companies.py
