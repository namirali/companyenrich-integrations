identity:
  name: search_companies
  author: namirali
  label:
    en_US: Search Companies
description:
  human:
    en_US: Find companies using a natural-language business description. Returns one
      page and may consume CompanyEnrich credits.
  llm: Find companies using a natural-language business description. Returns one page
    and may consume CompanyEnrich credits.
parameters:
- name: query
  type: string
  required: true
  label:
    en_US: Query
  human_description:
    en_US: A description of the companies to find, up to 500 characters.
  llm_description: A description of the companies to find, up to 500 characters.
  form: llm
- name: page
  type: number
  required: false
  default: 1
  min: 1
  max: 10000
  precision: 0
  label:
    en_US: Page
  human_description:
    en_US: Page number, starting at 1. Page × page size cannot exceed 10,000.
  llm_description: Page number, starting at 1. Page × page size cannot exceed 10,000.
  form: llm
- name: page_size
  type: number
  required: false
  default: 10
  min: 1
  max: 100
  precision: 0
  label:
    en_US: Page Size
  human_description:
    en_US: Maximum results on this page. Additional pages require explicit tool calls
      and may consume credits.
  llm_description: Maximum results on this page. Additional pages require explicit
    tool calls and may consume credits.
  form: llm
extra:
  python:
    source: tools/search_companies.py
