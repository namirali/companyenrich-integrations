identity:
  name: search_companies
  author: namirali
  label:
    en_US: Search Companies
description:
  human:
    en_US: Search Companies using CompanyEnrich. Preserves the full response; one
      request per invocation, no retries. May consume credits.
  llm: Search Companies using CompanyEnrich. Preserves the full response; one request
    per invocation, no retries. May consume credits.
parameters:
- name: query
  type: string
  required: false
  label:
    en_US: Query
  human_description:
    en_US: Natural-language company search (up to 500 characters), or person name
      search for Search People.
  llm_description: Natural-language company search (up to 500 characters), or person
    name search for Search People.
  form: llm
- name: literal_query
  type: string
  required: false
  label:
    en_US: Literal Query
  human_description:
    en_US: Company name/domain search (up to 250 characters); can be combined with
      semantic search.
  llm_description: Company name/domain search (up to 250 characters); can be combined
    with semantic search.
  form: llm
- name: filters
  type: string
  required: false
  label:
    en_US: Filters
  human_description:
    en_US: JSON object with documented structured filters. Dedicated nonempty parameters
      take precedence. See https://docs.companyenrich.com/reference/.
  llm_description: JSON object with documented structured filters. Dedicated nonempty
    parameters take precedence. See https://docs.companyenrich.com/reference/.
  form: llm
- name: page
  type: number
  required: false
  label:
    en_US: Page
  human_description:
    en_US: One-based page. Page × page size cannot exceed 10,000.
  llm_description: One-based page. Page × page size cannot exceed 10,000.
  form: llm
  default: 1
  min: 1
  max: 10000
  precision: 0
- name: page_size
  type: number
  required: false
  label:
    en_US: Page Size
  human_description:
    en_US: Results per page (1–100). No automatic pagination.
  llm_description: Results per page (1–100). No automatic pagination.
  form: llm
  default: 10
  min: 1
  max: 100
  precision: 0
- name: expand
  type: string
  required: false
  label:
    en_US: Expand
  human_description:
    en_US: Comma-separated expansions (workforce for company routes, education for
      people routes).
  llm_description: Comma-separated expansions (workforce for company routes, education
    for people routes).
  form: llm
extra:
  python:
    source: tools/search_companies.py
