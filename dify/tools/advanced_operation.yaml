- name: body
  type: string
  required: false
  label:
    en_US: Body
  human_description:
    en_US: Request body as a JSON object. Export jobs require an explicit count (maximum
      50,000). No automatic polling or result downloading.
  llm_description: Request body as a JSON object. Export jobs require an explicit
    count (maximum 50,000). No automatic polling or result downloading.
  form: llm
- name: query_parameters
  type: string
  required: false
  label:
    en_US: Query Parameters
  human_description:
    en_US: URL query parameters as a JSON object; array values are repeated query
      parameters.
  llm_description: URL query parameters as a JSON object; array values are repeated
    query parameters.
  form: llm
- name: path_parameters
  type: string
  required: false
  label:
    en_US: Path Parameters
  human_description:
    en_US: Path placeholders such as jobId as a JSON object.
  llm_description: Path placeholders such as jobId as a JSON object.
  form: llm
- name: allow_beta
  type: boolean
  required: false
  label:
    en_US: Allow Beta
  human_description:
    en_US: Explicitly enable beta email operations for this invocation. Defaults to
      false.
  llm_description: Explicitly enable beta email operations for this invocation. Defaults
    to false.
  form: llm
  default: false
extra:
  python:
    source: tools/advanced_operation.py
