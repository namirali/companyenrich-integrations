[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "companyenrich-camel"
version = "0.1.0"
description = "CompanyEnrich company research tools for camel"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CompanyEnrich"}]
# CAMEL 0.2.90 imports MCP 1.x FastMCP and the OpenAI 2.x API.
dependencies = ["camel-ai>=0.2.90,<0.3", "httpx>=0.27", "mcp>=1.3,<2", "openai>=1.86,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.11", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/companyenrich_camel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
